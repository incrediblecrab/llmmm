<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The site's one finding, at 16 pixels: things falling either side of a
       line. Two dots below the baseline, one above, in the same vermillion
       and blue the charts use. Colours are literal rather than tokens
       because a favicon is rendered by browser chrome, outside the page. -->
  <rect width="32" height="32" fill="#ffffff"/>
  <circle cx="8"  cy="10" r="4.5" fill="#d1441f"/>
  <circle cx="8"  cy="22" r="4.5" fill="#d1441f"/>
  <circle cx="24" cy="16" r="4.5" fill="#16688f"/>
  <line x1="16" y1="3" x2="16" y2="29" stroke="#12161a" stroke-width="2.5"/>
</svg>
