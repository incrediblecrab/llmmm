name: Model code and recorded results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model/pyproject.toml
      - name: Install CPU training and development dependencies
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet -e '.[dev]'
      - name: Run data-independent regression tests
        run: python -m pytest tests/ -m "not data" -q
      - name: Check current results against their exact sources
        run: python scripts/project_status.py --check
